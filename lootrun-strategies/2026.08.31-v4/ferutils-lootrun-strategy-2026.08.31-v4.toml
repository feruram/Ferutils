schema_version = 3
strategy_version = "2026.08.31-log-calibrated-v4"
name = "Ferutils log-calibrated lootrun strategy — premium beacons before objectives"

[defaults]
beacon_score = 20
mission_score = 25
default_phase = "FARM"
reroll_recommend = false

[thresholds]
