initial_limit = 12
emergency_remaining = 4
setup_min_limit = 35
setup_min_choices = 5
first_mission_fallback = 20
grey_deadline = 40
crimson_unlock = 20
crimson_prepare_end = 55
crimson_end = 70
danger_time = 75
red_low_time = 360
red_next_low_time = 300
keep_score = 150
rainbow_reroll_start = 14
rainbow_full_hunt_start = 18
rainbow_early_reserve = 4
rainbow_late_reserve = 2

[messages]
beacon_default = "現在状態で標準的な選択です"
reroll_default = "現在の候補から選択"

[stop]
default_level = "続行"
default_reason = "直ちに終了する条件はありません"

