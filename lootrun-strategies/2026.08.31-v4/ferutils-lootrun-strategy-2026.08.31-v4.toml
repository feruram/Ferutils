[[phase_rules]]
id = "phase_exit"
phase = "EXIT"
when = "remaining <= 1 or risk == 'DANGER' or timer <= 90"

[[phase_rules]]
id = "phase_opening"
phase = "OPENING"
when = "completed < opening_end and not rainbow_active"

[[phase_rules]]
id = "phase_extend"
phase = "EXTEND"
when = "limit < setup_min_limit or choices < 4"

[[phase_rules]]
id = "phase_missions"
phase = "MISSIONS"
when = "mission_count < mission_slots and completed < 50"

[[phase_rules]]
id = "phase_trials"
phase = "TRIALS"
when = "completed_trial_count < trial_slots and completed < crimson_end"

[[phase_rules]]
id = "phase_farm"
phase = "FARM"
when = "true"

[[setup_rules]]
id = "setup_red_emergency"
when = "limit <= initial_limit and remaining <= emergency_remaining"
text = "【Red最優先】初期上限のまま残り{remaining} Challengeです。Redで即時延長します"

[[setup_rules]]
id = "setup_red_target"
when = "limit <= initial_limit and remaining > emergency_remaining"
text = "【Challenge 10までのRed確保目標】Rainbow後の強化Whiteを狙うため、先にRedで初期上限を延長します"

[[setup_rules]]
id = "setup_white_hold"
when = "limit <= initial_limit"
text = "Whiteは通常1回のみです。緊急時を除き、未強化Whiteは避け、Rainbow → Aqua → Whiteを狙います"

[[setup_rules]]
id = "setup_extended"
when = "limit > initial_limit"
text = "【延長確保済み】Challenge上限 {limit}。Whiteで延長できていればRed未取得でも問題ありません"

[[setup_rules]]
id = "setup_first_mission_waiting"
when = "mission_count == 0 and pending_mission != '' and not (rainbow_active and white_taken and limit >= setup_min_limit and choices >= setup_min_choices) and completed < first_mission_fallback"
text = "【初回Missionは保留寄り】固定締切はありません。セットアップ未完了のため、Rainbow・強化White・Beacon 5択を先に整えます"

[[setup_rules]]
id = "setup_first_mission_ready"
when = "mission_count == 0 and pending_mission != '' and rainbow_active and white_taken and limit >= setup_min_limit and choices >= setup_min_choices"
text = "【初回Mission完了候補】Rainbow・強化White・Beacon 5択が揃っています"

[[setup_rules]]
id = "setup_first_mission_fallback"
when = "mission_count == 0 and pending_mission != '' and completed >= first_mission_fallback and not (rainbow_active and white_taken and limit >= setup_min_limit and choices >= setup_min_choices)"
text = "【初回Mission回収を優先】後続Greyが遅れるためObjective完了へ切り替えます"

[[setup_rules]]
id = "setup_first_mission_offer"
when = "mission_count == 0 and pending_mission == ''"
text = "【初回Mission】Challenge 4後に提示。選択後も延長セットアップまでObjective完了を遅らせます"

[[setup_rules]]
id = "setup_later_mission_wait"
when = "mission_count > 0 and pending_mission != '' and completed < first_mission_fallback and not (rainbow_active and white_taken and limit >= setup_min_limit and choices >= setup_min_choices)"
text = "【Mission Objectiveは保留寄り】序盤セットアップ未完了です"

[[setup_rules]]
id = "setup_grey_before_deadline"
when = "mission_count > 0 and grey_left > 0 and completed < grey_deadline"
text = "【Grey回収】残り {grey_left} 回。Challenge {grey_deadline}前の取得を目指します"

[[setup_rules]]
id = "setup_grey_late"
when = "mission_count > 0 and grey_left > 0 and completed >= grey_deadline"
text = "【Grey回収遅延】残り {grey_left} 回を優先します"

[[stop_rules]]
id = "stop_early_reset"
when = "completed < 4 and protected_value and choices <= 3 and orange_count == 0"
level = "リセット検討"
reason = "第4Challenge開始前なら保持物を失わずに失敗終了できます"

[[stop_rules]]
id = "stop_danger_curses_setup"
when = "risk == 'DANGER' and curses >= 8 and (mission_count < 3 or completed_trial_count + (1 if active_trial != '' else 0) < 2)"
level = "終了検討"
reason = "危険ですが、少なくとも3 Mission・2 Trialの構築前なので即時終了はしません"

[[stop_rules]]
id = "stop_danger_curses"
when = "risk == 'DANGER' and curses >= 8 and mission_count >= 3 and completed_trial_count + (1 if active_trial != '' else 0) >= 2"
level = "終了推奨"
reason = "3 Mission・2 Trialを確認済みで、危険度が高くCurseも8以上です"

[[stop_rules]]
id = "stop_low_time"
when = "timer <= danger_time and active_trial != 'Side Hustle'"
level = "終了検討"
reason = "残り時間が{timer}秒です。Greenなしの移動は高リスクです"

[[stop_rules]]
id = "stop_low_time_danger"
when = "timer <= danger_time and active_trial != 'Side Hustle' and risk != 'SAFE' and mission_count >= 3 and completed_trial_count + (1 if active_trial != '' else 0) >= 2"
level = "終了推奨"
reason = "時間と危険度の両方が危険域です"

[[stop_rules]]
id = "stop_critical_time"
when = "timer <= 20 and active_trial != 'Side Hustle'"
level = "終了推奨"
reason = "残り20秒以下でGreen救済が間に合わない可能性が高いため終了します"

[[stop_rules]]
id = "stop_final"
when = "remaining <= 1"
level = "最終Challenge"
reason = "最終Challengeです。Mission・Trial完了や一部Beaconは機能しません"

[[stop_rules]]
id = "stop_no_combo"
when = "mission_count >= 3 and completed_trial_count + (1 if active_trial != '' else 0) >= 2 and combo_count == 0 and completed >= 55"
level = "短期終了ルート"
reason = "3 Mission・2 Trial確認後も主要Comboがないため、短期終了を検討します"

[[routes]]
id = "Lights Out"
required_trials = ["Lights Out"]
synergy_missions = ["Inner Peace", "Porphyrophobia"]

[[routes]]
id = "Chronotrigger"
required_missions = ["Porphyrophobia"]
required_trials = ["Chronotrigger"]
synergy_missions = ["Beleza Pura", "Radiant Hunter", "Route Indigo", "Chronokinesis", "Complete Chaos"]

[[routes]]
id = "Ostinato"
required_missions = ["Ostinato"]
synergy_missions = ["Interest Scheme", "Hoarder", "Jester's Trick"]

[[routes]]
id = "Jester's Scheme"
required_missions = ["Interest Scheme", "Jester's Trick"]
synergy_missions = ["Ostinato", "Beleza Pura", "Materialism", "Hoarder"]

[[routes]]
id = "Opal Offering"
required_missions = ["Opal Offering"]
synergy_missions = ["Sacrificial Ritual", "Equilibrium", "Route Indigo", "Optimism"]

[[routes]]
id = "Knife Thrill"
required_missions = ["Knife Edge", "Thrill Seeker"]

[[routes]]
id = "Gambling Beast"
required_trials = ["Gambling Beast"]
synergy_missions = ["Redemption", "High Roller", "Optimism", "Backup Beat"]

[[routes]]
id = "Dying Light + All In"
required_trials = ["Dying Light", "All In"]

[[policy_rules]]
id = "route_progress"
scope = ["mission", "trial", "boon", "challenge"]
when = "route_progress_gain > 0 and route_preexisting_progress > 0"
add = "45 * route_progress_gain"
reason = "既存ルート {action_required_routes} を前進させます"

[[policy_rules]]
id = "route_completion"
scope = ["mission", "trial", "boon", "challenge"]
when = "route_completion_gain > 0 and route_preexisting_progress > 0"
add = "65 * route_completion_gain"
reason = "既存ルート {action_required_routes} を完成させます"

[[policy_rules]]
id = "route_synergy"
scope = ["mission", "trial", "boon", "challenge"]
when = "route_synergy_count > 0 and completed_route_synergy_count == 0"
add = "25 * route_synergy_count"
reason = "構築中のルートと相乗します"

[[policy_rules]]
id = "completed_route_synergy"
scope = ["mission", "trial", "boon", "challenge"]
when = "completed_route_synergy_count > 0"
add = "80 * completed_route_synergy_count"
reason = "完成済みルートと直接相乗します"

[[policy_rules]]
id = "route_conflict"
scope = ["mission", "trial", "boon", "challenge"]
when = "route_conflict_count > 0"
add = "-120 * route_conflict_count"
warning = "確定ルートと競合します"

[[policy_rules]]
id = "challenge_expected_value"
scope = "challenge"
utility = { pulls = "action_pulls", boxes = "action_boxes", rerolls = "action_rerolls", sacrifices = "action_sacrifices", time_cost = "action_travel_seconds + action_clear_seconds", risk = "action_failure_probability" }

[[tie_breakers]]
scope = "*"
expression = "final_score"
direction = "desc"
priority = 0

[[tie_breakers]]
scope = "*"
expression = "route_completion_gain"
direction = "desc"
priority = 10

[[tie_breakers]]
scope = "*"
expression = "action_index"
direction = "asc"
priority = 100

[[beacon_rules]]
id = "beacon_rainbow_active"
choices = ["Rainbow"]
when = "rainbow_active"
add = -55
reason = "Rainbowの残り効果を延長します"

[[beacon_rules]]
id = "beacon_rainbow_setup"
choices = ["Rainbow"]
when = "not rainbow_active"
reason = "全Beacon強化はセットアップの中核です"

[[beacon_rules]]
id = "beacon_rainbow_unclaimed_priority"
choices = ["Rainbow"]
when = "not rainbow_active"
add = 40
reason = "未取得Rainbowを確定し、将来のCrimsonを含む複数Beaconを継続的に強化します"

[[beacon_rules]]
id = "beacon_rainbow_knife"
choices = ["Rainbow"]
when = '''"Knife Edge" in missions'''
add = -35
warning = "Knife Thrillは低Power Redを好むため相性が悪いです"

[[beacon_rules]]
id = "beacon_orange_full"
choices = ["Orange"]
when = "choices >= 5"
add = -40

[[beacon_rules]]
id = "beacon_orange_phase"
choices = ["Orange"]
when = "phase in ['OPENING', 'EXTEND']"
add = 25
reason = "選択肢を増やし重要Beaconを確保しやすくします"

[[beacon_rules]]
id = "beacon_orange_expiring"
choices = ["Orange"]
when = "orange_count > 0 and orange_max <= 4 and choices <= 4"
add = 100
reason = "Orange終了直前に提示数を維持し、次の重要Beaconを探せる状態を保ちます"

[[beacon_rules]]
id = "beacon_aqua_saturated"
choices = ["Aqua"]
when = "aqua_stacks >= 2"
add = -30
warning = "Power上限に近く、追加Stackの価値は低下します"

[[beacon_rules]]
id = "beacon_aqua_crimson_gate"
choices = ["Aqua"]
when = "completed in [18, 19] and (rainbow_active or 'Rainbow' not in offered)"
add = 30
reason = "Challenge 20以降に解禁されるCrimsonへ強化を準備できます"

[[beacon_rules]]
id = "beacon_aqua_prepare_crimson"
choices = ["Aqua"]
when = "crimson_unlock <= completed < crimson_prepare_end and crimson_taken < trial_slots and active_trial == '' and crimson_skips < 2 and choices >= 4 and rerolls > 0 and timer >= 450 and red_remaining == 0 and completed not in [18, 19] and 'Crimson' not in offered and (rainbow_active or 'Rainbow' not in offered)"
add = 70
reason = "次のCrimsonをPower 3以上にしてTrial選択肢を増やします"

[[beacon_rules]]
id = "beacon_aqua_general"
choices = ["Aqua"]
when = "true"
reason = "次の重要Beaconを強化できます"

[[beacon_rules]]
id = "beacon_aqua_extension_setup"
choices = ["Aqua"]
when = "aqua_stacks == 0 and limit < 100 and remaining <= 8 and 'Red' not in offered and 'White' not in offered"
add = 50
reason = "延長Beaconが未提示のため、次のRed・Whiteを高Powerで取る準備をします"

[[beacon_rules]]
id = "beacon_aqua_extension_setup_urgent"
choices = ["Aqua"]
when = "aqua_stacks == 0 and limit < 100 and remaining <= 5 and 'Red' not in offered and 'White' not in offered"
add = 35
reason = "延長Beaconを引く猶予が少ないため、Mission報酬より延長準備を優先します"

[[beacon_rules]]
id = "beacon_aqua_orange_expiring"
choices = ["Aqua"]
when = "aqua_stacks == 0 and limit < 100 and remaining <= 12 and orange_count > 0 and orange_max <= 3 and 'Red' not in offered and 'White' not in offered"
add = 75
reason = "Orange終了前にAquaを確保し、少ない提示数でも次の延長Beaconを強化します"

[[beacon_rules]]
id = "beacon_aqua_flying_cycle"
choices = ["Aqua"]
when = '''aqua_stacks == 0 and "Interest Scheme" in missions and "Jester's Trick" in missions'''
add = 55
reason = "Jester's SchemeのAqua→Yellow循環を開始します"

[[beacon_rules]]
id = "beacon_aqua_gambling_green"
choices = ["Aqua"]
when = "aqua_stacks == 0 and 'Gambling Beast' in completed_trials"
add = 90
reason = "Gambling Beast用の強化Greenを準備します"

[[beacon_rules]]
id = "beacon_aqua_early_duplicate"
choices = ["Aqua"]
when = "completed < opening_end and aqua_stacks > 0"
add = -90
warning = "保持中Aquaの使用先を先に探します"

[[beacon_rules]]
id = "beacon_pink_stocked"
choices = ["Pink"]
when = "rerolls > 2"
add = -32

[[beacon_rules]]
id = "beacon_pink_choices"
choices = ["Pink"]
when = "choices >= 4"
add = 10
reason = "Rerollを確保して重要Beaconを探せます"

[[beacon_rules]]
id = "beacon_red_urgent"
choices = ["Red"]
when = "remaining < 4"
add = 120
reason = "残り3 Challenge以下ではMission進行よりラン継続を優先します"

[[beacon_rules]]
id = "beacon_red_reserve"
choices = ["Red"]
when = '''limit < 100 and 4 <= remaining <= 8 and timer >= 450 and "Knife Edge" not in missions and "Thrill Seeker" not in missions'''
add = 90
reason = "次の提示不発に備え、残Challenge 8以内で延長を確保します"

[[beacon_rules]]
id = "beacon_red_reserve_low_time"
choices = ["Red"]
when = '''limit < 100 and 4 <= remaining <= 8 and timer < 450 and "Knife Edge" not in missions'''
add = -80
warning = "Red延長分は自然時間を得ないため、先にGreenでTimerを確保します"

[[beacon_rules]]
id = "beacon_red_long_route"
choices = ["Red"]
when = '''limit < 100 and completed >= 50 and remaining <= 12 and combo_count > 0 and "Knife Edge" not in missions'''
add = 45
reason = "成立した長期ルートをChallenge 100へ延長します"

[[beacon_rules]]
id = "beacon_red_extended"
choices = ["Red"]
when = "remaining >= 4 and limit >= setup_min_limit"
add = -25

[[beacon_rules]]
id = "beacon_red_initial"
choices = ["Red"]
when = "limit <= initial_limit"
reason = "初期上限を延長し、Rainbow → Aqua → Whiteの余裕を作ります"

[[beacon_rules]]
id = "beacon_red_initial_emergency"
choices = ["Red"]
when = "limit <= initial_limit and remaining <= emergency_remaining"
add = 140
reason = "残Challengeが少ないため最優先で延長します"

[[beacon_rules]]
id = "beacon_red_low_time"
choices = ["Red"]
when = "timer < red_low_time"
add = -35
warning = "Red Challenge中は通常の時間獲得がありません"

[[beacon_rules]]
id = "beacon_red_combo"
choices = ["Red"]
when = '''"Knife Edge" in missions or "Thrill Seeker" in missions'''
add = 35
reason = "Knife・Thrill戦略と相乗します"

[[beacon_rules]]
id = "beacon_red_general"
choices = ["Red"]
when = "true"
reason = "残Challengeを延長します"

[[beacon_rules]]
id = "beacon_white_late"
choices = ["White"]
when = "limit >= 50"
add = -45

[[beacon_rules]]
id = "beacon_white_value"
choices = ["White"]
when = "true"
reason = "Power {power}でChallengeを{effect_value}追加できます"

[[beacon_rules]]
id = "beacon_white_initial_emergency"
choices = ["White"]
when = "limit <= initial_limit and remaining <= emergency_remaining"
add = 140
reason = "未延長のまま残Challengeが少ないため即時延長します"

[[beacon_rules]]
id = "beacon_white_unboosted"
choices = ["White"]
when = "limit <= initial_limit and remaining > emergency_remaining and power == 1"
add = -125
warning = "Whiteは通常1回のみです。Rainbow＋Aqua後まで温存します"

[[beacon_rules]]
id = "beacon_white_aqua_only"
choices = ["White"]
when = "limit <= initial_limit and remaining > emergency_remaining and power == 2 and not rainbow_active"
add = -55
warning = "Rainbow＋AquaのPower 3以上を優先します"

[[beacon_rules]]
id = "beacon_white_power_three"
choices = ["White"]
when = "power >= 3"
add = 65
reason = "一回限りのWhiteを十分なPower 3以上で確保します"

[[beacon_rules]]
id = "beacon_white_before_rainbow"
choices = ["White"]
when = "limit > initial_limit and power < 3 and not rainbow_active and completed < 15 and remaining > emergency_remaining"
add = -65
warning = "Rainbow探索前のWhiteは温存します"

[[beacon_rules]]
id = "beacon_white_knife"
choices = ["White"]
when = '''"Knife Edge" in missions'''
add = -45
warning = "残Challenge増加でKnife EdgeのPullが減ります"

[[beacon_rules]]
id = "beacon_green_before_offered_red"
choices = ["Green"]
when = "red_remaining == 0 and 'Red' in offered and limit < 100 and remaining <= 8 and timer < 600"
add = 150
reason = "提示済みRedを取る前に、無時間Challenge分のTimerを確保します"

[[beacon_rules]]
id = "beacon_green_red_critical"
choices = ["Green"]
