when = "goal not in ['SHORT', 'REROLLS'] and ((1 if 'Redemption' in missions else 0) + (1 if 'High Roller' in missions else 0) + (1 if 'Optimism' in missions else 0) + (1 if 'Backup Beat' in missions else 0)) < 2"
add = -70
warning = "Gambling Beast支援Missionが2つ未満のため、通常の長期ルートを維持します"

[[trial_rules]]
id = "trial_gambling_flying_route_block"
choices = ["Gambling Beast"]
when = '''goal == 'BOXES' or (goal not in ['SHORT', 'REROLLS'] and (('Interest Scheme' in missions and ('Materialism' in missions or 'Hoarder' in missions or "Jester's Trick" in missions)) or ('Materialism' in missions and 'Hoarder' in missions)))'''
add = -180
block = true
warning = "Flying Chest長期運用をTimer消費で終了させるため、明示的なSHORT/REROLLS目的以外では選びません"

[[trial_rules]]
id = "trial_gambling_combo"
choices = ["Gambling Beast"]
when = "combo_count > 0"
add = -35
warning = "有効なMissionコンボを維持する100 Challenge運用と衝突します"

[[trial_rules]]
id = "trial_hubris_danger"
choices = ["Hubris"]
when = "risk == 'DANGER'"
add = -70
warning = "現在の危険度で死亡即終了は不適です"

[[trial_rules]]
id = "trial_first_two_sacrifices"
choices = ["Ultimate Sacrifice", "Hubris"]
when = "sacrifices < 2"
add = 30
reason = "通常ランでも最低2 Sacrificeを確保する価値があります"

[[trial_rules]]
id = "trial_ultimate_no_boon"
choices = ["Ultimate Sacrifice"]
when = "boon_count == 0"
add = 15
reason = "失うBoon効果が少ない状態です"

[[trial_rules]]
id = "trial_chrono_timer"
choices = ["Chronotrigger"]
when = "timer < 600"
add = -45
warning = "12 Challengeを時間獲得なしで越すにはTimerが不足気味です"

[[trial_rules]]
id = "trial_chrono_porphy"
choices = ["Chronotrigger"]
when = "'Porphyrophobia' in missions"
add = 55
reason = "Porphyrophobiaを主Pull源にできます"

[[trial_rules]]
id = "trial_lights_porphy"
choices = ["Lights Out"]
when = "'Porphyrophobia' in missions"
add = 45
reason = "大量CurseをPullへ変換できます"

[[trial_rules]]
id = "trial_treasury_pulls"
choices = ["Treasury Bill"]
when = "pulls >= 20"
add = 35
reason = "現在Pullがあり完了時+75%を活かせます"

[[trial_rules]]
id = "trial_side_hustle_camp"
choices = ["Side Hustle"]
when = "camp in ['Corkus', 'Molten Heights']"
add = 20
reason = "Chest経路を取りやすいCampです"

[[trial_rules]]
id = "trial_warmth_safe"
choices = ["Warmth Devourer"]
when = "remaining >= 35"
add = 5
reason = "3 Challengeずつの消費を吸収できる大きな余裕があります"

[[trial_rules]]
id = "trial_warmth_danger"
choices = ["Warmth Devourer"]
when = "remaining < 35"
add = -70
warning = "25 Pull獲得まで3 Challengeずつ消費するため、残Challengeが不足します"

[[trial_rules]]
id = "trial_dying_light_boon"
choices = ["Dying Light"]
when = "completed <= 50 and remaining >= 20"
add = 20
reason = "開始後に800% Boon Potencyを得るためのChallenge余裕があります"

[[trial_rules]]
id = "trial_dying_light_late"
choices = ["Dying Light"]
when = "completed > 50 or remaining < 20"
add = -70
warning = "開始後に800% Boon Potencyを得る余裕が不足しています"

[[trial_rules]]
id = "trial_all_in_sacrifices"
choices = ["All In"]
when = "sacrifices >= 3"
add = 45
reason = "Sacrificeを各3 Rerollへ変換できます"

[[trial_rules]]
id = "trial_goal"
when = "goal_bonus != 0"
add = "goal_bonus"
reason = "選択した目的に合致します"

[[reroll_target_rules]]
id = "reroll_grey_setup"
when = "mission_count < 3 and pending_mission == '' and mission_count > 0 and completed < grey_deadline and 'Grey' not in offered and rerolls > rainbow_late_reserve"
targets = ["Grey"]
reason = "少なくとも3 Missionを確保するためGreyを探索"

[[reroll_target_rules]]
id = "reroll_crimson_setup"
when = "completed_trial_count + (1 if active_trial != '' else 0) < 2 and active_trial == '' and crimson_unlock <= completed < crimson_prepare_end and 'Crimson' not in offered and rerolls > rainbow_early_reserve"
targets = ["Crimson"]
reason = "少なくとも2 Trialを確保するためCrimsonを探索"

[[reroll_target_rules]]
id = "reroll_extension"
when = "remaining <= emergency_remaining and 'Red' not in offered and 'White' not in offered"
targets = ["Red", "White"]
reason = "残Challengeの即時延長が必要"
emergency = true

[[reroll_target_rules]]
id = "reroll_time"
when = "active_trial not in ['Chronotrigger', 'Side Hustle'] and 'Green' not in offered and (timer <= danger_time or (red_remaining > 0 and timer <= red_low_time) or (red_remaining == 0 and 'Red' not in offered and limit < 100 and 5 <= remaining <= 7 and timer <= red_next_low_time))"
targets = ["Green"]
reason = "残り時間が危険域"
emergency = true

[[reroll_target_rules]]
id = "reroll_aqua_crimson"
when = "aqua_stacks > 0 and completed >= crimson_unlock and crimson_taken < trial_slots and active_trial == '' and 'Crimson' not in offered"
targets = ["Crimson"]
reason = "Aqua StackをCrimsonへ使用"

[[reroll_target_rules]]
id = "reroll_aqua_white"
when = "aqua_stacks > 0 and not (completed >= crimson_unlock and crimson_taken < trial_slots and active_trial == '' and 'Crimson' not in offered) and not white_taken and (rainbow_active or completed >= 15) and 'White' not in offered"
targets = ["White"]
reason = "Aqua Stackを一度限りのWhiteへ使用"

[[reroll_target_rules]]
id = "reroll_early_aqua_orange"
when = "aqua_stacks > 0 and completed < opening_end and choices < 6 and 'Orange' not in offered and not (('Orange' in offered and choices < 6) or ('Blue' in offered and (boon_count < 3 or boon_potency < 300)) or ('Pink' in offered and rerolls <= 3) or ('Red' in offered and remaining <= 6))"
targets = ["Orange"]
reason = "保持中Aquaの有力な使用先を探索"

[[reroll_target_rules]]
id = "reroll_early_aqua_blue"
when = "aqua_stacks > 0 and completed < opening_end and (boon_count < 3 or boon_potency < 300) and 'Blue' not in offered and not (('Orange' in offered and choices < 6) or ('Blue' in offered and (boon_count < 3 or boon_potency < 300)) or ('Pink' in offered and rerolls <= 3) or ('Red' in offered and remaining <= 6))"
targets = ["Blue"]
reason = "保持中Aquaの有力な使用先を探索"

[[reroll_target_rules]]
id = "reroll_early_aqua_pink"
when = "aqua_stacks > 0 and completed < opening_end and rerolls <= 3 and 'Pink' not in offered and not (('Orange' in offered and choices < 6) or ('Blue' in offered and (boon_count < 3 or boon_potency < 300)) or ('Pink' in offered and rerolls <= 3) or ('Red' in offered and remaining <= 6))"
targets = ["Pink"]
reason = "保持中Aquaの有力な使用先を探索"

[[reroll_target_rules]]
id = "reroll_early_aqua_red"
when = "aqua_stacks > 0 and completed < opening_end and remaining <= 6 and 'Red' not in offered and not (('Orange' in offered and choices < 6) or ('Blue' in offered and (boon_count < 3 or boon_potency < 300)) or ('Pink' in offered and rerolls <= 3) or ('Red' in offered and remaining <= 6))"
targets = ["Red"]
reason = "保持中Aquaの有力な使用先を探索"

[[reroll_target_rules]]
id = "reroll_rainbow"
when = "completed >= opening_end and not rainbow_active and 'Rainbow' not in offered and (completed <= 30 or 'Dying Light' in completed_trials)"
targets = ["Rainbow"]
reason = "序盤セットアップ、またはDying Light用のRainbowを確保"

[[reroll_target_rules]]
id = "reroll_aqua_before_crimson_unlock"
when = "completed in [18, 19] and aqua_stacks == 0 and rainbow_active and 'Aqua' not in offered"
targets = ["Aqua"]
reason = "Challenge 20以降に解禁されるCrimsonを強化"

[[reroll_target_rules]]
id = "reroll_aqua_before_crimson"
when = "false"
targets = ["Aqua"]
reason = "表示済みCrimsonはskipせず確保"

[[reroll_target_rules]]
id = "reroll_objective_time"
when = "pending_mission != '' and mission_target > 0 and mission_ratio >= 0.75 and (completed >= first_mission_fallback or (rainbow_active and white_taken and limit >= setup_min_limit and choices >= setup_min_choices)) and mission_objective == 'TIME' and 'Green' not in offered"
targets = ["Green"]
reason = "進行中MissionのObjective完了を優先"

[[reroll_target_rules]]
id = "reroll_objective_pulls"
when = "pending_mission != '' and mission_target > 0 and mission_ratio >= 0.75 and (completed >= first_mission_fallback or (rainbow_active and white_taken and limit >= setup_min_limit and choices >= setup_min_choices)) and mission_objective == 'PULLS' and 'Purple' not in offered"
targets = ["Purple"]
reason = "進行中MissionのObjective完了を優先"

[[reroll_target_rules]]
id = "reroll_objective_chests"
when = "pending_mission != '' and mission_target > 0 and mission_ratio >= 0.75 and (completed >= first_mission_fallback or (rainbow_active and white_taken and limit >= setup_min_limit and choices >= setup_min_choices)) and mission_objective in ['CHESTS', 'ITEMS'] and 'Yellow' not in offered"
targets = ["Yellow"]
reason = "進行中MissionのObjective完了を優先"

[[reroll_target_rules]]
id = "reroll_objective_boons"
when = "pending_mission != '' and mission_target > 0 and mission_ratio >= 0.75 and (completed >= first_mission_fallback or (rainbow_active and white_taken and limit >= setup_min_limit and choices >= setup_min_choices)) and mission_objective == 'BOONS' and 'Blue' not in offered"
targets = ["Blue"]
reason = "進行中MissionのObjective完了を優先"

[[reroll_target_rules]]
id = "reroll_objective_curses"
when = "pending_mission != '' and mission_target > 0 and mission_ratio >= 0.75 and (completed >= first_mission_fallback or (rainbow_active and white_taken and limit >= setup_min_limit and choices >= setup_min_choices)) and mission_objective == 'CURSES' and 'Purple' not in offered"
targets = ["Purple"]
reason = "進行中MissionのObjective完了を優先"

[[reroll_target_rules]]
id = "reroll_objective_rerolls"
when = "pending_mission != '' and mission_target > 0 and mission_ratio >= 0.75 and (completed >= first_mission_fallback or (rainbow_active and white_taken and limit >= setup_min_limit and choices >= setup_min_choices)) and mission_objective == 'REROLLS' and 'Pink' not in offered"
targets = ["Pink"]
reason = "進行中MissionのObjective完了を優先"

[[reroll_decision_rules]]
id = "reroll_unavailable"
when = "rerolls <= 0 or pending_beacon != ''"
recommend = false
reason = "Rerollを使用できません"

[[reroll_decision_rules]]
id = "reroll_no_target"
when = "not has_targets"
recommend = false
reason = "現在の候補から選択"

[[reroll_decision_rules]]
id = "reroll_target_offered"
when = "target_offered"
recommend = false
reason = "目的のBeaconが提示済み"

[[reroll_decision_rules]]
id = "reroll_rainbow_ramp_wait"
when = "not emergency and not rainbow_active and completed < rainbow_reroll_start"
recommend = false
reason = "Rainbow解禁直後は出現率の上昇待ちとし、Rerollを温存"

[[reroll_decision_rules]]
id = "reroll_rainbow_early_reserve"
when = "not emergency and not rainbow_active and completed < rainbow_full_hunt_start and rerolls <= rainbow_early_reserve"
recommend = false
reason = "Rainbow探索前半の予備Rerollを4回温存"

[[reroll_decision_rules]]
id = "reroll_rainbow_late_reserve"
when = "not emergency and not rainbow_active and rerolls <= rainbow_late_reserve"
recommend = false
reason = "緊急延長・Mission・Crimson用にRerollを2回温存"

[[reroll_decision_rules]]
id = "reroll_few_choices"
when = "choices < 4 and not emergency and not (aqua_stacks > 0 and completed < opening_end and rerolls >= 3)"
recommend = false
reason = "選択肢4未満のためRerollを温存"

[[reroll_decision_rules]]
id = "reroll_last"
when = "rerolls == 1 and not emergency and (aqua_stacks == 0 or completed < opening_end)"
recommend = false
reason = "最後のRerollを緊急延長用に温存"

[[reroll_decision_rules]]
id = "reroll_keep_by_goal"
when = "not emergency and ((goal == 'BALANCED' and best_score >= 150) or (goal == 'PULLS' and best_score >= 100) or (goal == 'BOXES' and best_score >= 170) or (goal == 'REROLLS' and best_score >= 150) or (goal == 'SACRIFICES' and best_score >= 135) or (goal == 'SHORT' and best_score >= 150))"
recommend = false
reason = "{best_name}が目的別の保持基準を満たします"

[[reroll_decision_rules]]
id = "reroll_use"
when = "true"
recommend = true

